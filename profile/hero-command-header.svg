<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="260">
  <defs>
    <!-- Google Fonts for High-End Typography -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=Cinzel:wght@600;700;800;900&amp;family=Outfit:wght@300;400;500;600;700;800&amp;display=swap');

      .name-font {
        font-family: 'Cinzel', 'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif;
      }
      .title-font {
        font-family: 'Space Grotesk', 'Outfit', sans-serif;
      }
      .sub-font {
        font-family: 'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif;
      }

      @keyframes subtleShine {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      .shine {
        animation: subtleShine 4s ease-in-out infinite;
      }
    </style>

    <!-- Luxury Velvet Background Gradient -->
    <linearGradient id="luxuryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="35%" stop-color="#0A0F24" />
      <stop offset="70%" stop-color="#140C1A" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Metallic Platinum & Champagne Gold Name Gradient -->
    <linearGradient id="champagneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#FED7AA" />
      <stop offset="85%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <!-- Refined Minimal Border -->
    <linearGradient id="minimalBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#F97316" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3" />
    </linearGradient>

    <!-- Smooth Ambient Light Blooms -->
    <radialGradient id="leftGlow" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rightGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#luxuryBg)" stroke="url(#minimalBorder)" stroke-width="1.2" />

  <!-- Smooth Velvet Light Blooms -->
  <rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#leftGlow)" />
  <rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#rightGlow)" />
  <rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#centerGlow)" />

  <!-- Sleek Top Accent Pill Bar -->
  <g transform="translate(600, 42)">
    <rect x="-180" y="-14" width="360" height="28" rx="14" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
    <circle cx="-160" cy="0" r="3.5" fill="#10B981" />
    <text x="0" y="4" class="title-font" style="font-size: 10px; font-weight: 600; fill: #E2E8F0; letter-spacing: 2px; text-anchor: middle; text-transform: uppercase;">
      PORTFOLIO &amp; ENGINEERING REPERTORY
    </text>
  </g>

  <!-- MAIN NAME: ELEGANT, SCULPTURAL CINZEL / JAKARTA TYPOGRAPHY -->
  <g transform="translate(600, 118)">
    <text x="0" y="0" class="name-font" style="font-size: 44px; font-weight: 800; letter-spacing: 3px; fill: url(#champagneGrad); text-anchor: middle; filter: drop-shadow(0px 3px 8px rgba(0,0,0,0.9));">
      NAVARI YASHWANTH REDDY
    </text>
  </g>

  <!-- PROFESSIONAL ROLES SUBTITLE -->
  <g transform="translate(600, 156)">
    <text x="0" y="0" class="title-font" style="font-size: 13.5px; font-weight: 500; fill: #94A3B8; letter-spacing: 2.2px; text-anchor: middle; text-transform: uppercase;">
      Data Scientist <tspan fill="#F97316">•</tspan> Machine Learning Engineer <tspan fill="#38BDF8">•</tspan> Full Stack Developer <tspan fill="#10B981">•</tspan> Patented IoT Innovator
    </text>
  </g>

  <!-- ELEGANT DIVIDER LINE -->
  <g transform="translate(600, 182)">
    <line x1="-240" y1="0" x2="240" y2="0" stroke="url(#minimalBorder)" stroke-width="1" />
    <polygon points="0,-3 4,0 0,3 -4,0" fill="#F97316" />
  </g>

  <!-- BOTTOM ACCREDITATION BADGES -->
  <g transform="translate(600, 220)">
    <!-- Badge 1: Patent -->
    <g transform="translate(-290, 0)">
      <rect x="-130" y="-13" width="260" height="26" rx="13" fill="#0E1626" stroke="#334155" stroke-width="0.8" />
      <text x="0" y="4" class="sub-font" style="font-size: 9.5px; font-weight: 600; fill: #F59E0B; letter-spacing: 0.5px; text-anchor: middle;">
        ★ Patent No. 470097-001 (Govt. of India)
      </text>
    </g>

    <!-- Badge 2: Academic Affiliation -->
    <g transform="translate(0, 0)">
      <rect x="-120" y="-13" width="240" height="26" rx="13" fill="#0E1626" stroke="#334155" stroke-width="0.8" />
      <text x="0" y="4" class="sub-font" style="font-size: 9.5px; font-weight: 600; fill: #38BDF8; letter-spacing: 0.5px; text-anchor: middle;">
        🎓 Woxsen University • Data Science
      </text>
    </g>

    <!-- Badge 3: Location -->
    <g transform="translate(270, 0)">
      <rect x="-100" y="-13" width="200" height="26" rx="13" fill="#0E1626" stroke="#334155" stroke-width="0.8" />
      <text x="0" y="4" class="sub-font" style="font-size: 9.5px; font-weight: 600; fill: #10B981; letter-spacing: 0.5px; text-anchor: middle;">
        📍 Hyderabad, India
      </text>
    </g>
  </g>
</svg>
