<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="290">
  <defs>
    <!-- Embedded Fonts for maximum cross-platform rendering -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Outfit:wght@400;600;700;800&amp;display=swap');

      .font-display {
        font-family: 'Syne', 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'Space Grotesk', 'Fira Code', monospace;
      }
      .font-sans {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* Clean subtle animation */
      @keyframes softPulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes subtleShimmer {
        0% { stop-color: #FFFFFF; }
        50% { stop-color: #FED7AA; }
        100% { stop-color: #FFFFFF; }
      }
      @keyframes floatBeam {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(1400px); }
      }

      .pulse-indicator {
        animation: softPulse 2.5s infinite ease-in-out;
      }
      .shimmer-text {
        animation: subtleShimmer 6s infinite ease-in-out;
      }
      .beam-line {
        animation: floatBeam 8s infinite linear;
      }
    </style>

    <!-- Background Base Gradient -->
    <linearGradient id="premiumDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#0B0F19" />
      <stop offset="80%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>

    <!-- Refined Name Gradient (White to Platinum with subtle warmth) -->
    <linearGradient id="luxuryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F8FAFC" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Orange Gradient -->
    <linearGradient id="orangeGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Sleek Hairline Border -->
    <linearGradient id="hairlineBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#F97316" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Lighting Blooms -->
    <radialGradient id="orangeBloom" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanBloom" cx="70%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Clean Glass Pill Filter -->
    <filter id="cleanShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0" />
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1196" height="286" rx="14" fill="url(#premiumDarkBg)" stroke="url(#hairlineBorder)" stroke-width="1.2" />

  <!-- Atmospheric Light Blooms -->
  <rect x="2" y="2" width="1196" height="286" rx="14" fill="url(#orangeBloom)" />
  <rect x="2" y="2" width="1196" height="286" rx="14" fill="url(#cyanBloom)" />

  <!-- Precision Geometric Hairline Grid (10% Opacity) -->
  <g stroke="#334155" stroke-width="0.6" opacity="0.18">
    <line x1="60" y1="0" x2="60" y2="290" />
    <line x1="300" y1="0" x2="300" y2="290" />
    <line x1="600" y1="0" x2="600" y2="290" />
    <line x1="900" y1="0" x2="900" y2="290" />
    <line x1="1140" y1="0" x2="1140" y2="290" />
    <line x1="0" y1="52" x2="1200" y2="52" />
    <line x1="0" y1="228" x2="1200" y2="228" />
  </g>

  <!-- Animated Top Edge Light Beam -->
  <g class="beam-line">
    <line x1="0" y1="2" x2="160" y2="2" stroke="url(#beamGrad)" stroke-width="2" />
  </g>

  <!-- TOP BAR: MINIMAL STATUS BADGES -->
  <!-- Top Left: Live Status -->
  <g transform="translate(36, 26)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10B981" class="pulse-indicator" />
    <text x="26" y="16.5" class="font-mono" style="font-size: 9.5px; font-weight: 700; fill: #E2E8F0; letter-spacing: 0.8px;">SYSTEM ONLINE</text>
    <text x="114" y="16.5" class="font-mono" style="font-size: 8.5px; font-weight: 600; fill: #64748B;">// 99.98%</text>
  </g>

  <!-- Top Right: Patent Verification Badge -->
  <g transform="translate(896, 26)">
    <rect x="0" y="0" width="268" height="26" rx="13" fill="#0B1120" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#F59E0B" />
    <text x="26" y="16.5" class="font-mono" style="font-size: 9.5px; font-weight: 700; fill: #F59E0B; letter-spacing: 0.5px;">PATENT NO: 470097-001</text>
    <text x="180" y="16.5" class="font-mono" style="font-size: 8.5px; font-weight: 600; fill: #94A3B8;">• GOVT OF INDIA</text>
  </g>

  <!-- CENTER CONTENT -->
  <!-- Eyebrow Sub-tag -->
  <g transform="translate(600, 92)">
    <text x="0" y="0" class="font-mono" style="font-size: 11.5px; font-weight: 700; fill: #F97316; letter-spacing: 3.5px; text-anchor: middle; text-transform: uppercase;">
      ENGINEERING COMMAND CENTER
    </text>
  </g>

  <!-- Main Hero Name (Sculptural, High-End Typography) -->
  <g transform="translate(600, 142)">
    <text x="0" y="0" class="font-display" style="font-size: 46px; font-weight: 900; letter-spacing: 2px; fill: url(#luxuryTextGrad); text-anchor: middle; filter: drop-shadow(0px 4px 12px rgba(0,0,0,0.8));">
      NAVARI YASHWANTH REDDY
    </text>
  </g>

  <!-- Sub-Headline -->
  <g transform="translate(600, 178)">
    <text x="0" y="0" class="font-sans" style="font-size: 14.5px; font-weight: 600; fill: #94A3B8; letter-spacing: 1.5px; text-anchor: middle; text-transform: uppercase;">
      Systems Architect <tspan fill="#F97316">•</tspan> Patented IoT Innovator <tspan fill="#38BDF8">•</tspan> AI/ML Engineer
    </text>
  </g>

  <!-- BOTTOM PILL SPECIFICATIONS -->
  <g transform="translate(600, 240)">
    <!-- Pill 1: IoT Patent -->
    <g transform="translate(-400, 0)">
      <rect x="0" y="0" width="248" height="30" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1" filter="url(#cleanShadow)" />
      <circle cx="16" cy="15" r="3.5" fill="#F97316" />
      <text x="28" y="19" class="font-mono" style="font-size: 9.5px; font-weight: 700; fill: #F1F5F9; letter-spacing: 0.5px;">Patented M2M Hardware Node</text>
    </g>

    <!-- Pill 2: AI Pipelines -->
    <g transform="translate(-124, 0)">
      <rect x="0" y="0" width="248" height="30" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1" filter="url(#cleanShadow)" />
      <circle cx="16" cy="15" r="3.5" fill="#38BDF8" />
      <text x="28" y="19" class="font-mono" style="font-size: 9.5px; font-weight: 700; fill: #F1F5F9; letter-spacing: 0.5px;">Deterministic Neural Pipelines</text>
    </g>

    <!-- Pill 3: Distributed Systems -->
    <g transform="translate(152, 0)">
      <rect x="0" y="0" width="248" height="30" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1" filter="url(#cleanShadow)" />
      <circle cx="16" cy="15" r="3.5" fill="#10B981" />
      <text x="28" y="19" class="font-mono" style="font-size: 9.5px; font-weight: 700; fill: #F1F5F9; letter-spacing: 0.5px;">Distributed Cloud Systems</text>
    </g>
  </g>
</svg>
