<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="35%" stop-color="#0B1120" />
      <stop offset="70%" stop-color="#180C04" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Name Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFEDD5" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scanner Line Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0" />
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes scanMove {
      0% { transform: translateX(0px); opacity: 0.1; }
      50% { transform: translateX(1160px); opacity: 0.7; }
      100% { transform: translateX(0px); opacity: 0.1; }
    }
    @keyframes radarPulse {
      0%, 100% { r: 3; opacity: 1; }
      50% { r: 7; opacity: 0.3; }
    }
    @keyframes energyFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Segoe UI', monospace; }
    .hero-name {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 5px;
      fill: url(#nameGrad);
      text-anchor: middle;
    }
    .hero-title {
      font-size: 15.5px;
      font-weight: 700;
      fill: #38BDF8;
      letter-spacing: 3px;
      text-anchor: middle;
      text-transform: uppercase;
    }
    .hero-sub {
      font-size: 12px;
      font-weight: 600;
      fill: #94A3B8;
      letter-spacing: 1.8px;
      text-anchor: middle;
      text-transform: uppercase;
    }
    .hud-label {
      font-size: 9.5px;
      fill: #64748B;
      letter-spacing: 1.2px;
      font-weight: 700;
    }
    .hud-val {
      font-size: 10px;
      fill: #F97316;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .hud-green { fill: #10B981; }
    .hud-cyan { fill: #38BDF8; }
    .tag-box {
      rx: 5px;
      fill: #0F172A;
      stroke: #334155;
      stroke-width: 1;
    }
    .tag-txt {
      font-size: 10px;
      font-weight: 700;
      fill: #F1F5F9;
      text-anchor: middle;
      letter-spacing: 1px;
    }
    .scanner {
      animation: scanMove 7s infinite ease-in-out;
    }
    .pulse-dot {
      animation: radarPulse 2s infinite ease-in-out;
    }
    .conduit {
      stroke-dasharray: 8 6;
      animation: energyFlow 15s linear infinite;
    }
  </style>

  <!-- Main Background -->
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#heroBg)" stroke="url(#heroBorder)" stroke-width="1.8" />

  <!-- Cyber Grid Lines -->
  <g stroke="#1E293B" stroke-width="0.8" opacity="0.35">
    <line x1="40" y1="40" x2="1160" y2="40" />
    <line x1="40" y1="100" x2="1160" y2="100" />
    <line x1="40" y1="240" x2="1160" y2="240" />
    <line x1="40" y1="300" x2="1160" y2="300" />
    
    <line x1="120" y1="20" x2="120" y2="320" />
    <line x1="300" y1="20" x2="300" y2="320" />
    <line x1="900" y1="20" x2="900" y2="320" />
    <line x1="1080" y1="20" x2="1080" y2="320" />
  </g>

  <!-- Glowing Laser Scanner -->
  <rect x="20" y="20" width="3" height="300" fill="url(#scanGrad)" class="scanner" />

  <!-- Animated Outer Conduit Accents -->
  <path d="M 20 60 L 60 20 L 1140 20 L 1180 60 L 1180 280 L 1140 320 L 60 320 L 20 280 Z" fill="none" stroke="#F97316" stroke-width="1" opacity="0.4" class="conduit" />

  <!-- High-Tech Corner Brackets -->
  <path d="M 12 40 L 12 12 L 40 12" fill="none" stroke="#F97316" stroke-width="2.5" />
  <path d="M 1188 40 L 1188 12 L 1160 12" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <path d="M 12 300 L 12 328 L 40 328" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <path d="M 1188 300 L 1188 328 L 1160 328" fill="none" stroke="#10B981" stroke-width="2.5" />

  <!-- TOP LEFT HUD TELEMETRY -->
  <g transform="translate(36, 38)">
    <circle cx="6" cy="6" r="4" fill="#10B981" class="pulse-dot" filter="url(#subtleGlow)" />
    <text x="20" y="9" class="mono hud-label">SYS_STATUS: <tspan class="hud-val hud-green">ONLINE // NOMINAL</tspan></text>
    <text x="20" y="24" class="mono hud-label">COMMAND_NODE: <tspan class="hud-val">YASHWANTH_NAVARI</tspan></text>
    <text x="20" y="39" class="mono hud-label">SYSTEM_RANK: <tspan class="hud-val hud-cyan">LEVEL 10 ARCHITECT</tspan></text>
  </g>

  <!-- TOP RIGHT HUD TELEMETRY -->
  <g transform="translate(970, 38)">
    <circle cx="6" cy="6" r="4" fill="#F59E0B" class="pulse-dot" filter="url(#subtleGlow)" />
    <text x="20" y="9" class="mono hud-label">PATENT_STATUS: <tspan class="hud-val" style="fill: #F59E0B;">GRANTED [470097-001]</tspan></text>
    <text x="20" y="24" class="mono hud-label">PACKET_FIDELITY: <tspan class="hud-val hud-green">99.98% ZERO-LOSS</tspan></text>
    <text x="20" y="39" class="mono hud-label">LOCATION: <tspan class="hud-val hud-cyan">HYDERABAD, INDIA</tspan></text>
  </g>

  <!-- CENTER CORE HERO IDENTIFICATION -->
  <g transform="translate(600, 142)">
    <!-- Ambient Hologram Glow Backing -->
    <ellipse cx="0" cy="0" rx="380" ry="40" fill="#F97316" opacity="0.08" filter="url(#neonGlow)" />
    
    <!-- Top System Eyebrow -->
    <text x="0" y="-38" class="mono hero-sub">// AUTONOMOUS SYSTEMS ARCHITECTURE AND DISTRIBUTED COMPUTING //</text>

    <!-- Main Name -->
    <text x="0" y="16" class="mono hero-name" filter="url(#subtleGlow)">NAVARI YASHWANTH REDDY</text>

    <!-- Subtitle Title -->
    <text x="0" y="52" class="mono hero-title">PATENTED IOT INNOVATOR • AI/ML SYSTEMS ARCHITECT • FULL-STACK ENGINEER</text>
  </g>

  <!-- BOTTOM PILLAR PILLS -->
  <g transform="translate(600, 260)">
    <!-- Pill 1 -->
    <g transform="translate(-420, 0)">
      <rect x="0" y="0" width="260" height="34" class="tag-box" stroke="#F97316" />
      <circle cx="18" cy="17" r="4" fill="#F97316" />
      <text x="138" y="21.5" class="mono tag-txt">💡 PATENTED M2M HARDWARE</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-130, 0)">
      <rect x="0" y="0" width="260" height="34" class="tag-box" stroke="#38BDF8" />
      <circle cx="18" cy="17" r="4" fill="#38BDF8" />
      <text x="138" y="21.5" class="mono tag-txt">🧠 PRODUCTION AI/ML ENGINES</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="260" height="34" class="tag-box" stroke="#10B981" />
      <circle cx="18" cy="17" r="4" fill="#10B981" />
      <text x="138" y="21.5" class="mono tag-txt">⚡ RESILIENT CLOUD PLATFORMS</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="200" y1="318" x2="1000" y2="318" stroke="url(#heroBorder)" stroke-width="1.2" opacity="0.6" />
  <circle cx="600" cy="318" r="3" fill="#F97316" />
</svg>
