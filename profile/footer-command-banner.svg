<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#180C04" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="footBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="footGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes footPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Segoe UI', monospace; }
    .foot-main {
      font-size: 24px;
      font-weight: 800;
      fill: #F8FAFC;
      letter-spacing: 2px;
      text-anchor: middle;
    }
    .foot-sub {
      font-size: 13px;
      font-weight: 600;
      fill: #F97316;
      letter-spacing: 2px;
      text-anchor: middle;
      text-transform: uppercase;
    }
    .foot-caption {
      font-size: 10px;
      font-weight: 500;
      fill: #94A3B8;
      letter-spacing: 1.5px;
      text-anchor: middle;
    }
    .accent-dot {
      animation: footPulse 2s infinite ease-in-out;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="1196" height="176" rx="14" fill="url(#footBg)" stroke="url(#footBorder)" stroke-width="1.8" />

  <!-- Corner Tech Accents -->
  <path d="M 14 30 L 14 14 L 30 14" fill="none" stroke="#F97316" stroke-width="2" />
  <path d="M 1186 30 L 1186 14 L 1170 14" fill="none" stroke="#38BDF8" stroke-width="2" />
  <path d="M 14 150 L 14 166 L 30 166" fill="none" stroke="#38BDF8" stroke-width="2" />
  <path d="M 1186 150 L 1186 166 L 1170 166" fill="none" stroke="#10B981" stroke-width="2" />

  <!-- Background Cyber Lines -->
  <line x1="40" y1="90" x2="360" y2="90" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="840" y1="90" x2="1160" y2="90" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Main Center Content -->
  <g transform="translate(600, 68)">
    <text x="0" y="0" class="mono foot-main">ARCHITECTING THE FUTURE, ONE NODE AT A TIME.</text>
    <text x="0" y="32" class="mono foot-sub">SYSTEMS ARCHITECTURE • PATENTED M2M HARDWARE • DETERMINISTIC AI</text>
    <text x="0" y="58" class="mono foot-caption">// DEVELOPED AND DEPLOYED BY NAVARI YASHWANTH REDDY • HYDERABAD, INDIA //</text>
  </g>

  <!-- Left and Right Beacon Dots -->
  <circle cx="380" cy="90" r="4" fill="#F97316" class="accent-dot" filter="url(#footGlow)" />
  <circle cx="820" cy="90" r="4" fill="#38BDF8" class="accent-dot" filter="url(#footGlow)" />
</svg>
