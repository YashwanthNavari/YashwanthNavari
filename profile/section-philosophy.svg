<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 62" width="100%" height="62">
  <defs>
    <linearGradient id="secBg_PHILOSOPHY" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="secBorder_PHILOSOPHY" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow_PHILOSOPHY" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Segoe UI', monospace; }
    .sec-title { font-size: 14px; font-weight: 800; fill: #10B981; letter-spacing: 1.5px; text-transform: uppercase; }
    .sec-sub { font-size: 10px; font-weight: 600; fill: #94A3B8; letter-spacing: 0.8px; text-transform: uppercase; }
    .badge-text { font-size: 9px; font-weight: 700; fill: #F8FAFC; text-anchor: middle; }
    .pulse-node { animation: pulseNode_PHILOSOPHY 2.5s infinite ease-in-out; }
    @keyframes pulseNode_PHILOSOPHY {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="58" rx="8" fill="url(#secBg_PHILOSOPHY)" stroke="#334155" stroke-width="1.2" />
  <path d="M 2 12 L 12 2 M 878 12 L 868 2 M 2 50 L 12 60 M 878 50 L 868 60" stroke="#10B981" stroke-width="1.5" />

  <!-- Left Indicator -->
  <g transform="translate(18, 31)">
    <circle cx="0" cy="0" r="5" fill="#10B981" class="pulse-node" filter="url(#glow_PHILOSOPHY)" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Titles -->
  <text x="36" y="27" class="mono sec-title">ENGINEERING PHILOSOPHY AND PRINCIPLES</text>
  <text x="36" y="45" class="mono sec-sub">FIRST-PRINCIPLES SYSTEMS AND ROBUST DESIGN RULES</text>

  <!-- Right Cyber Tag -->
  <g transform="translate(740, 18)">
    <rect x="0" y="0" width="115" height="24" rx="4" fill="#0B1120" stroke="#10B981" stroke-width="1" />
    <text x="57.5" y="16" class="mono badge-text">// PHILOSOPHY</text>
  </g>
</svg>