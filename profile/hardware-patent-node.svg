<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180">
  <defs>
    <linearGradient id="patBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
    .heading { font-size: 14px; font-weight: 700; fill: #F97316; letter-spacing: 1.5px; text-transform: uppercase; }
    .subtext { font-size: 11px; fill: #94A3B8; }
    .tech-pill { font-size: 10px; font-weight: 600; fill: #38BDF8; }
    .pin { fill: #E2E8F0; }
    .trace { stroke: #F97316; stroke-width: 1.5; fill: none; stroke-dasharray: 4 2; }
    .trace-cyan { stroke: #38BDF8; stroke-width: 1.5; fill: none; }
    .trace-green { stroke: #10B981; stroke-width: 1.5; fill: none; stroke-dasharray: 3 3; }
    .pulse-glow { animation: pulseGlow 2.5s infinite ease-in-out; }
    @keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>

  <!-- Base Enclosure -->
  <rect x="2" y="2" width="876" height="176" rx="12" fill="url(#patBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Top Banner Accent -->
  <path d="M 2 12 L 12 2 M 878 12 L 868 2 M 2 168 L 12 178 M 878 168 L 868 178" stroke="#F97316" stroke-width="2" />
  <line x1="16" y1="36" x2="864" y2="36" stroke="#1E293B" stroke-width="1" />

  <!-- Header Section -->
  <g transform="translate(20, 24)">
    <circle cx="8" cy="-2" r="5" fill="#F97316" class="pulse-glow" filter="url(#neonGlow)" />
    <text x="22" y="2" class="mono heading">PATENTED CYBER-PHYSICAL HARDWARE NODE // DESIGN NO: 470097-001</text>
    <rect x="690" y="-12" width="150" height="20" rx="4" fill="#7C2D12" stroke="#F97316" stroke-width="1" />
    <text x="765" y="2" class="mono" style="font-size: 10px; font-weight: 700; fill: #FED7AA; text-anchor: middle;">GRANTED BY GOVT. OF INDIA</text>
  </g>

  <!-- Left: Schematic Microcontroller & Bus -->
  <g transform="translate(30, 56)">
    <!-- MCU Chip Body -->
    <rect x="0" y="0" width="130" height="96" rx="6" fill="#0B1120" stroke="#F97316" stroke-width="1.8" />
    <text x="65" y="38" class="mono" style="font-size: 11px; font-weight: 700; fill: #F8FAFC; text-anchor: middle;">MCU CORE</text>
    <text x="65" y="54" class="mono" style="font-size: 9px; fill: #94A3B8; text-anchor: middle;">ESP32 / C-FIRMWARE</text>
    <text x="65" y="70" class="mono" style="font-size: 9px; fill: #38BDF8; text-anchor: middle;">LOW POWER M2M</text>

    <!-- Pins Left -->
    <rect x="-8" y="16" width="8" height="6" class="pin" rx="1" />
    <rect x="-8" y="32" width="8" height="6" class="pin" rx="1" />
    <rect x="-8" y="48" width="8" height="6" class="pin" rx="1" />
    <rect x="-8" y="64" width="8" height="6" class="pin" rx="1" />

    <!-- Pins Right -->
    <rect x="130" y="16" width="8" height="6" class="pin" rx="1" />
    <rect x="130" y="32" width="8" height="6" class="pin" rx="1" />
    <rect x="130" y="48" width="8" height="6" class="pin" rx="1" />
    <rect x="130" y="64" width="8" height="6" class="pin" rx="1" />
  </g>

  <!-- Circuit Traces Connecting MCU to Telemetry Layers -->
  <g transform="translate(168, 56)">
    <!-- Trace 1 (Top: SPI/I2C) -->
    <path d="M 0 19 L 45 19 L 65 35 L 140 35" class="trace" />
    <circle cx="140" cy="35" r="3" fill="#F97316" />

    <!-- Trace 2 (Mid: High-Throughput UART) -->
    <path d="M 0 51 L 140 51" class="trace-cyan" />
    <circle cx="140" cy="51" r="3" fill="#38BDF8" />

    <!-- Trace 3 (Bottom: Power Gating) -->
    <path d="M 0 83 L 45 83 L 65 67 L 140 67" class="trace-green" />
    <circle cx="140" cy="67" r="3" fill="#10B981" />
  </g>

  <!-- Middle: Telemetry & Ingestion Module -->
  <g transform="translate(320, 56)">
    <rect x="0" y="0" width="220" height="96" rx="6" fill="#0B1120" stroke="#38BDF8" stroke-width="1.5" />
    <text x="14" y="24" class="mono" style="font-size: 11px; font-weight: 700; fill: #38BDF8;">SIGNALING &amp; PROTOCOLS</text>
    <text x="14" y="44" class="mono subtext">• Noise-Filtered PCB Routing</text>
    <text x="14" y="62" class="mono subtext">• Real-Time Hardware Sensor Bus</text>
    <text x="14" y="80" class="mono subtext">• 0% Telemetry Loss Ingestion</text>
  </g>

  <!-- Connect to Cloud Bridge -->
  <g transform="translate(540, 56)">
    <path d="M 0 48 L 40 48" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="40,48 34,44 34,52" fill="#38BDF8" />
  </g>

  <!-- Right: Edge-to-Cloud Output -->
  <g transform="translate(590, 56)">
    <rect x="0" y="0" width="260" height="96" rx="6" fill="#0B1120" stroke="#10B981" stroke-width="1.5" />
    <text x="14" y="24" class="mono" style="font-size: 11px; font-weight: 700; fill: #34D399;">CLOUD STREAMING BRIDGE</text>
    <text x="14" y="44" class="mono subtext">• Ingestion to AWS / PostgreSQL</text>
    <text x="14" y="62" class="mono subtext">• Sub-12ms AI Inference Trigger</text>
    <text x="14" y="80" class="mono subtext">• WebSocket Live Multi-Client Broadcast</text>
  </g>
</svg>
